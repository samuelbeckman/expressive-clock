<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Expressive Clock for Android: alarms, timers, stopwatch and world clock.">
  <title>Expressive Clock</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f7f8fc; color: #202124; }
    main { box-sizing: border-box; width: min(720px, 100%); padding: 48px; background: white; border-radius: 28px; box-shadow: 0 8px 36px #1b2b4410; }
    .eyebrow { color: #2463a6; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: .5rem 0; font-size: clamp(2.4rem, 8vw, 4rem); letter-spacing: -.045em; line-height: 1.08; }
    p { line-height: 1.7; }
    a { color: #145db5; }
    .links { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 28px; }
    @media (max-width: 600px) { main { padding: 32px 24px; border-radius: 0; box-shadow: none; } body { background: white; } }
    @media (prefers-color-scheme: dark) { body { background: #111318; color: #e8eaed; } main { background: #1b1d23; box-shadow: none; } a { color: #8ab4f8; } .eyebrow { color: #8ab4f8; } }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Android app</div>
  <h1>Expressive Clock</h1>
  <p>A modern clock app featuring alarms, world clock, timers, a stopwatch, and an analog home-screen widget.</p>
  <div class="links">
    <a href="./privacy-policy.html">Privacy Policy</a>
    <a href="https://github.com/samuelbeckman/expressive-clock">View source on GitHub</a>
    <a href="mailto:support@samuelbeckman.com">Contact support</a>
  </div>
</main>
</body>
</html>
